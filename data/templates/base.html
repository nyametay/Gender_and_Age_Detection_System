<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - Gender & Age Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' }
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) &&
        window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen">
    {% include 'partials/header.html' %}
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
                  <div class="fixed top-16 left-1/2 transform -translate-x-1/2 w-full max-w-lg z-50 space-y-3 px-4" id="flash-container">
                          {% for category, msg in messages %}
                                  <div class="flash-msg px-4 py-3 rounded text-sm font-medium flex justify-between items-center
                                          {% if category == 'success' %}
                                            bg-green-100 text-green-800 dark:bg-green-800 dark:text-green-100
                                          {% elif category == 'danger' %}
                                            bg-red-100 text-red-800 dark:bg-red-800 dark:text-red-100
                                          {% elif category == 'warning' %}
                                            bg-yellow-100 text-yellow-800 dark:bg-yellow-800 dark:text-yellow-100
                                          {% elif category == 'info' %}
                                            bg-blue-100 text-blue-800 dark:bg-blue-800 dark:text-blue-100
                                          {% else %}
                                            bg-gray-100 text-gray-800 dark:bg-gray-800 dark:text-gray-200
                                          {% endif %}
                                  ">
                                    <span>{{ msg }}</span>
                                    <button type="button" class="ml-4 focus:outline-none" onclick="this.parentElement.remove()">
                                      &times;
                                    </button>
                                  </div>
                          {% endfor %}
                  </div>
          {% endif %}
    {% endwith %}

    {% block content %} {% endblock %}

    <script src="{{ url_for('static', filename='scripts/home.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/notification.js') }}"></script>
    {% block javascript %}{% endblock %}
</body>
</html>
