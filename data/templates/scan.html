{% extends "base.html" %}
{% block content %}
<div class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center p-4 w-full">
    <form class="w-full max-w-lg bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 space-y-6"
          action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">

        <!-- Title -->
        <div class="text-center">
            <p class="text-gray-600 dark:text-gray-300 mt-2">
                Upload a photo or use your webcam to detect gender and age instantly.
            </p>
        </div>

        <!-- Image Preview -->
        <div class="w-full h-64 bg-gray-200 dark:bg-gray-700 rounded-lg flex items-center justify-center overflow-hidden">
            <img id="preview" class="max-h-full max-w-full hidden" alt="Preview" />
            <span id="placeholder" class="text-gray-500 dark:text-gray-400">No image selected</span>
        </div>

        <!-- File Upload + Webcam -->
        <div class="flex flex-col sm:flex-row gap-4">
            <label class="flex-1">
                <input type="file" accept="image/*" class="hidden" id="fileInput" name="file"/>
                <div class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg text-center cursor-pointer">
                  Upload Image
                </div>
            </label>

            <button id="webcamBtn" type="button"
                    class="flex-1 bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-lg">
              Use Webcam
            </button>
        </div>

        <!-- Hidden field to hold webcam image -->
        <input type="hidden" name="image" id="webcamImage" />

        <!-- Detect Button -->
        <button class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 px-4 rounded-lg font-semibold" type="submit">
          Detect
        </button>

        <!-- Footer -->
        <p class="text-center text-sm text-gray-500 dark:text-gray-400">
          Powered by AI Vision Technology
        </p>
    </form>
</div>

<!-- Webcam Modal -->
<div id="webcamModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 space-y-4 w-full max-w-md text-center">
        <h2 class="text-lg font-semibold">📸 Capture from Webcam</h2>
        <video id="webcam" autoplay playsinline class="w-full rounded-lg shadow-md"></video>
        <canvas id="canvas" class="hidden"></canvas>
        <div class="flex justify-center gap-4 mt-4">
            <button id="captureBtn" type="button"
                    class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                Capture
            </button>
            <button id="closeModal" type="button"
                    class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">
                Cancel
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block javascript %}
<script src="{{ url_for('static', filename='scripts/index.js') }}"></script>
{% endblock %}
